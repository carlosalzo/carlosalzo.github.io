name: Sincronizar archivos de inicio de sesión de Firebase

# Libreta inicia sesión con Google desde este mismo dominio (carlosalzo.github.io),
# así funciona en iPhone/Safari. Esta tarea copia los archivos auxiliares de
# Firebase y los mantiene al día. Docs: https://firebase.google.com/docs/auth/web/redirect-best-practices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/firebase-auth.yml"]
  schedule:
    - cron: "17 9 * * 1"   # lunes

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Descargar archivos de Firebase
        run: |
          set -e
          SRC=https://bitacora-f99ae.firebaseapp.com
          mkdir -p __/auth __/firebase
          # GitHub Pages sirve /__/auth/handler desde handler.html (sin extensión lo bajaría como archivo)
          for f in handler.js experiments.js iframe.js links.js; do
            curl -fsSL "$SRC/__/auth/$f" -o "__/auth/$f" || { echo "no se pudo bajar $f"; rm -f "__/auth/$f"; }
          done
          for f in handler iframe links; do
            curl -fsSL "$SRC/__/auth/$f" -o "__/auth/$f.html" || { echo "no se pudo bajar $f"; rm -f "__/auth/$f.html"; }
            rm -f "__/auth/$f"
          done
          # init.json solo lo sirve Firebase Hosting (no está activado): se arma con la configuración de la app
          curl -fsSL "$SRC/__/firebase/init.json" -o __/firebase/init.json || cat > __/firebase/init.json <<'JSON'
          {"apiKey":"AIzaSyDvn-3s0nwKxB_EVT2uyQ-4H_ugUnpbHHk","authDomain":"carlosalzo.github.io","projectId":"bitacora-f99ae","storageBucket":"bitacora-f99ae.firebasestorage.app","messagingSenderId":"227506437762","appId":"1:227506437762:web:ea8f5e1c0e932c8f863e9b"}
          JSON
          for f in handler.html handler.js iframe.html iframe.js; do test -s "__/auth/$f" || { echo "falta $f"; exit 1; }; done
          ls -la __/auth __/firebase
      - name: Guardar cambios
        run: |
          git add -A __
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar archivos de inicio de sesión de Firebase"
          git push
